<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2212%22%20fill%3D%22%230a0a0a%22%2F%3E%3Cpath%20d%3D%22M22%2022h20v4H22zm0%208h20v4H22zm0%208h14v4H22z%22%20fill%3D%22%23fafafa%22%2F%3E%3C%2Fsvg%3E"
    />
    <title>Nutrition Ledger · 可溯源营养数据 MVP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --black: #0a0a0a;
        --white: #fafafa;
        --gray-100: #f5f5f5;
        --gray-200: #e8e8e8;
        --gray-400: #999;
        --gray-600: #666;
        --gray-800: #333;
        --measure: 980px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          monospace;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        background: var(--white);
        color: var(--black);
        line-height: 1.8;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: var(--black);
        color: var(--white);
      }

      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid var(--gray-200);
      }

      :where(a, button, input, textarea, select):focus-visible {
        outline: 2px solid var(--black);
        outline-offset: 2px;
      }

      .container {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 0 24px;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(250, 250, 250, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--gray-200);
      }

      .header-inner {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .logo {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 650;
        color: var(--gray-600);
        display: inline-flex;
        gap: 10px;
        align-items: baseline;
      }

      .tag {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 10px;
        border: 1px solid var(--gray-200);
        color: var(--gray-600);
      }

      .actions {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .nav {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        flex: 1 1 auto;
        min-width: 240px;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 1px;
        border: 1px solid var(--gray-200);
        color: var(--gray-600);
        cursor: pointer;
        user-select: none;
      }

      .tab:hover {
        border-color: var(--black);
        color: var(--black);
      }

      .tab[aria-current="page"] {
        border-color: var(--black);
        color: var(--black);
        background: rgba(10, 10, 10, 0.03);
      }

      .btn {
        appearance: none;
        border: 1px solid var(--black);
        background: transparent;
        color: var(--black);
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 1px;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--black);
        color: var(--white);
      }

      .btn.ghost {
        border-color: var(--gray-200);
        color: var(--gray-600);
      }

      .btn.ghost:hover {
        border-color: var(--black);
        background: var(--black);
        color: var(--white);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .hero {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 72px 24px 40px;
        text-align: center;
      }

      .hero-label {
        font-size: 11px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--gray-400);
        margin-bottom: 18px;
      }

      .hero h1 {
        font-size: clamp(28px, 4.8vw, 44px);
        font-weight: 300;
        letter-spacing: 1.6px;
        line-height: 1.2;
        margin-bottom: 10px;
      }

      .hero h1 strong {
        font-weight: 650;
      }

      .hero-sub {
        font-size: 13px;
        color: var(--gray-600);
        letter-spacing: 0.8px;
        max-width: 72ch;
        margin: 0 auto;
      }

      hr {
        border: none;
        border-top: 1px solid var(--gray-200);
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 18px;
        padding: 24px 0 72px;
      }

      @media (max-width: 940px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        border: 1px solid var(--gray-200);
        background: rgba(250, 250, 250, 0.9);
      }

      .panel-head {
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-title {
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gray-400);
        font-weight: 650;
      }

      .panel-body {
        padding: 14px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .label {
        font-size: 10px;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: var(--gray-600);
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--gray-200);
        background: rgba(245, 245, 245, 0.75);
        color: var(--black);
        padding: 10px 12px;
        border-radius: 0;
        font-size: 14px;
        line-height: 1.5;
        font-family: inherit;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .muted {
        color: var(--gray-600);
      }

      .mono {
        font-family: var(--mono);
      }

      .kpi {
        display: grid;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--gray-200);
        background: rgba(245, 245, 245, 0.6);
      }

      .kpi .k {
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gray-600);
      }

      .kpi .v {
        font-size: 14px;
        font-weight: 650;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .food {
        border: 1px solid var(--gray-200);
        background: rgba(250, 250, 250, 0.95);
        padding: 10px 12px;
        cursor: pointer;
        display: grid;
        gap: 2px;
      }

      .food[aria-current="true"] {
        border-color: var(--black);
      }

      .food-title {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .food-meta {
        font-size: 12px;
        color: var(--gray-600);
      }

      .split {
        display: grid;
        gap: 14px;
      }

      .subsection {
        border-top: 1px solid var(--gray-200);
        padding-top: 14px;
        display: grid;
        gap: 10px;
      }

      .subhead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .subhead h2 {
        font-size: 18px;
        letter-spacing: 0.6px;
        font-weight: 400;
      }

      .hint {
        font-size: 12px;
        color: var(--gray-600);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--gray-200);
        vertical-align: top;
      }

      th {
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gray-600);
        font-weight: 650;
      }

      .pillrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .pill {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 10px;
        border: 1px solid var(--gray-200);
        color: var(--gray-600);
        background: rgba(250, 250, 250, 0.95);
      }

      .pill.strong {
        border-color: var(--black);
        color: var(--black);
      }

      .row-actions {
        display: inline-flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
      }

      .tiny {
        padding: 6px 10px;
        font-size: 11px;
      }

      .dialog-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 10, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 1000;
      }

      .dialog-backdrop[aria-hidden="false"] {
        display: flex;
      }

      .dialog {
        width: min(860px, 96vw);
        max-height: 88vh;
        overflow: auto;
        background: var(--white);
        border: 1px solid var(--gray-200);
      }

      .dialog-head {
        position: sticky;
        top: 0;
        background: rgba(250, 250, 250, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--gray-200);
        padding: 14px 14px 12px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .dialog-title {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gray-600);
        font-weight: 650;
      }

      .dialog-body {
        padding: 14px;
      }

      .history-item {
        border: 1px solid var(--gray-200);
        background: rgba(245, 245, 245, 0.55);
        padding: 12px;
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .history-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .history-val {
        font-weight: 650;
      }

      .history-meta {
        font-size: 12px;
        color: var(--gray-600);
      }

      .thumb {
        width: 84px;
        height: 84px;
        border: 1px solid var(--gray-200);
        background: rgba(250, 250, 250, 0.9);
        object-fit: cover;
      }

      .lb {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 10, 0.74);
        display: none;
        z-index: 1200;
      }

      .lb[aria-hidden="false"] {
        display: block;
      }

      .lb-stage {
        position: absolute;
        inset: 18px;
        background: rgba(250, 250, 250, 0.98);
        border: 1px solid rgba(250, 250, 250, 0.4);
        overflow: hidden;
      }

      .lb-canvas {
        position: absolute;
        inset: 0;
        cursor: grab;
      }

      .lb-canvas:active {
        cursor: grabbing;
      }

      .lb-inner {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }

      .lb-inner img {
        display: block;
        max-width: none;
        max-height: none;
      }

      .lb-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-top: 1px solid var(--gray-200);
        background: rgba(250, 250, 250, 0.92);
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .lb-bar .meta {
        font-size: 12px;
        color: var(--gray-600);
      }

      @media print {
        .header,
        .actions,
        .btn,
        .panel-head button,
        .row-actions,
        .subsection .btn,
        .dialog-backdrop,
        .lb {
          display: none !important;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .panel {
          border: 1px solid #000;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span>ZON</span>
          <span class="tag">Nutrition Ledger · MVP</span>
        </div>
        <nav class="nav" aria-label="Primary">
          <a class="tab" href="#today" data-route="today" aria-current="page">Today</a>
          <a class="tab" href="#capture" data-route="capture">Capture</a>
          <a class="tab" href="#evidence" data-route="evidence">Evidence</a>
          <a class="tab" href="#foods" data-route="foods">Foods</a>
        </nav>
        <div class="actions">
          <span class="pill" id="pill-r2">R2: checking</span>
          <button class="btn ghost" id="btn-export" type="button">导出 JSON</button>
          <button class="btn" id="btn-new-food" type="button">新建食物</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="page"></div>
    </main>

    <div class="dialog-backdrop" id="dlg-backdrop" aria-hidden="true">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div class="dialog-head">
          <div class="dialog-title" id="dlg-title">History</div>
          <div class="row-actions">
            <button class="btn ghost tiny" id="dlg-close" type="button">关闭</button>
          </div>
        </div>
        <div class="dialog-body" id="dlg-body"></div>
      </div>
    </div>

    <div class="lb" id="lb" aria-hidden="true">
      <div class="lb-stage">
        <div class="lb-canvas" id="lb-canvas">
          <div class="lb-inner" id="lb-inner"></div>
        </div>
        <div class="lb-bar">
          <div class="meta" id="lb-meta">ESC 关闭 · 滚轮缩放 · 拖拽移动 · 双击重置</div>
          <button class="btn tiny" type="button" id="lb-close">关闭</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      const state = {
        bootstrap: null,
        foods: [],
        nutrients: [],
        route: "today",
        todayDate: "",
        todayView: null,
        capture: { foodId: "", evidenceId: "" },
        selectedFoodId: "",
        selectedFoodView: null,
        basis: { kind: "per-100g" },
        r2: { available: false },
        evidenceCache: {},
      };

      const api = {
        async get(path) {
          const res = await fetch(path, { headers: { "Cache-Control": "no-store" } });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
          return json;
        },
        async post(path, body) {
          const res = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Cache-Control": "no-store" },
            body: JSON.stringify(body || {}),
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
          return json;
        },
      };

      function fmt(dt) {
        const d = new Date(dt);
        if (Number.isNaN(d.getTime())) return String(dt || "");
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
          d.getDate()
        ).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(
          2,
          "0"
        )}`;
      }

      function fmtTime(dt) {
        const d = new Date(dt);
        if (Number.isNaN(d.getTime())) return String(dt || "");
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }

      function localDateNow() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function localTimeNow() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }

      function isoFromLocal(dateStr, timeStr) {
        const date = String(dateStr || "").trim();
        const time = String(timeStr || "").trim();
        if (!date) return new Date().toISOString();
        const full = time ? `${date}T${time}:00` : `${date}T00:00:00`;
        const d = new Date(full);
        if (Number.isNaN(d.getTime())) return new Date().toISOString();
        return d.toISOString();
      }

      function downloadJson(filename, obj) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function setPillR2(r2) {
        const el = $("#pill-r2");
        state.r2 = r2 || { available: false };
        if (!el) return;
        if (r2?.available) {
          el.textContent = r2.publicBase ? "R2: ready" : "R2: ready (no public base)";
          el.classList.add("strong");
        } else {
          el.textContent = "R2: off";
          el.classList.remove("strong");
        }
      }

      function routeFromHash() {
        const raw = String(location.hash || "").replace(/^#/, "");
        if (raw === "capture") return "capture";
        if (raw === "evidence") return "evidence";
        if (raw === "foods") return "foods";
        return "today";
      }

      function setActiveRoute(route) {
        state.route = route;
        $$("[data-route]").forEach((el) => {
          const r = el.getAttribute("data-route");
          if (r === route) el.setAttribute("aria-current", "page");
          else el.removeAttribute("aria-current");
        });
      }

      function renderPage(route) {
        const page = $("#page");
        if (!page) return;

        if (route === "evidence") {
          page.innerHTML = `
            <div class="hero" style="padding:34px 0 18px">
              <div class="hero-label">EVIDENCE · INBOX</div>
              <h1><strong>证据图片</strong>（手机上传 → 可回看）</h1>
              <p class="hero-sub">这里展示最近入库的证据图（Feishu / 网页上传等）。点缩略图可放大。</p>
            </div>
            <hr />
            <div class="grid">
              <section class="panel" aria-label="Evidence">
                <div class="panel-head">
                  <div class="panel-title">Evidence</div>
                  <div class="row-actions">
                    <button class="btn ghost tiny" id="ev-refresh" type="button">刷新</button>
                  </div>
                </div>
                <div class="panel-body">
                  <div class="kpi">
                    <div class="k">Count</div>
                    <div class="v mono" id="evidence-count">—</div>
                    <div class="muted" style="font-size:12px">缩略图来自 <span class="mono">/blobs/*</span></div>
                  </div>
                  <div style="height:12px"></div>
                  <div id="evidence-list"></div>
                </div>
              </section>
            </div>
          `;
          return;
        }

        if (route === "foods") {
          page.innerHTML = `
            <div class="hero" style="padding:34px 0 18px">
              <div class="hero-label">LIBRARY · DEFAULT VALUES</div>
              <h1><strong>默认营养值</strong>（可溯源 / 可切换 / 可回滚）</h1>
              <p class="hero-sub">这里管理“食物的默认数值来源”。当天摄入请去 Today。</p>
            </div>
            <hr />
            <div class="grid">
              <section class="panel" aria-label="Foods">
                <div class="panel-head"><div class="panel-title">Foods</div></div>
                <div class="panel-body">
                  <div class="field">
                    <div class="label">Search</div>
                    <input id="food-search" type="search" placeholder="按名称/条码过滤…" autocomplete="off" />
                  </div>
                  <div style="height: 12px"></div>
                  <div class="list" id="foods"></div>
                  <div style="height: 12px"></div>
                  <div class="kpi">
                    <div class="k">Data</div>
                    <div class="v mono" id="kpi-data">—</div>
                    <div class="muted" style="font-size: 12px">数据落盘在 <span class="mono">html/nutrition-ledger-mvp/data/</span></div>
                  </div>
                </div>
              </section>
              <section class="panel" aria-label="Details">
                <div class="panel-head">
                  <div class="panel-title">Detail</div>
                  <div class="pillrow" id="food-pills"></div>
                </div>
                <div class="panel-body">
                  <div class="split" id="detail">
                    <div class="kpi">
                      <div class="k">Start</div>
                      <div class="v">选择一个食物，或新建</div>
                      <div class="muted" style="font-size: 12px">推荐：去 Capture 上传图片/粘贴 OCR → 校对 → 一次性写入多条数值。</div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          `;
          return;
        }

        if (route === "capture") {
          page.innerHTML = `
            <div class="hero" style="padding:34px 0 18px">
              <div class="hero-label">CAPTURE · REVIEW · COMMIT</div>
              <h1><strong>录入 → 识别 → 校对 → 写账</strong></h1>

      function renderFoods() {
        const list = $("#foods");
        if (!list) return;
        const q = String($("#food-search")?.value || "").trim().toLowerCase();
        const filtered = state.foods.filter((f) => {
          const hay = `${f.label || ""} ${f.barcode || ""} ${f.brand || ""}`.toLowerCase();
          return !q || hay.includes(q);
        });

        list.innerHTML = "";
        for (const food of filtered) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "food";
          btn.setAttribute("aria-current", food.id === state.selectedFoodId ? "true" : "false");
          btn.innerHTML = `<div class="food-title">${escapeHtml(food.label || "(未命名)")}</div>
            <div class="food-meta">
              <span class="mono">${escapeHtml(food.barcode || "—")}</span>
              ${food.brand ? ` · ${escapeHtml(food.brand)}` : ""}
            </div>`;
          btn.addEventListener("click", () => selectFood(food.id));
          list.appendChild(btn);
        }

        $("#kpi-data").textContent = `${state.foods.length} foods`;
      }

      function renderFoodPills(view) {
        const el = $("#food-pills");
        if (!el) return;
        el.innerHTML = "";
        if (!view?.food) return;

        const food = view.food;
        const pills = [
          { text: food.kind || "food", strong: true },
          { text: food.barcode ? `barcode:${food.barcode}` : "custom", strong: false, mono: true },
          { text: food.brand ? `brand:${food.brand}` : "", strong: false },
        ].filter((p) => p.text);

        for (const p of pills) {
          const span = document.createElement("span");
          span.className = `pill ${p.strong ? "strong" : ""} ${p.mono ? "mono" : ""}`.trim();
          span.textContent = p.text;
          el.appendChild(span);
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function basisOptions() {
        return [
          { kind: "per-100g", label: "每 100g" },
          { kind: "per-100ml", label: "每 100ml" },
          { kind: "per-serving", label: "每份" },
        ];
      }

      function unitForBasisKind(kind) {
        const k = String(kind || "");
        if (k === "per-100ml") return "ml";
        if (k === "per-serving") return "serving";
        return "g";
      }

      function makeSelectionKey(foodId, nutrientId, basis) {
        const kind = basis?.kind || "unknown";
        if (kind === "per-serving" && basis?.servingSize?.quantity && basis?.servingSize?.unit) {
          return `${foodId}|${nutrientId}|per-serving:${basis.servingSize.quantity}${basis.servingSize.unit}`;
        }
        return `${foodId}|${nutrientId}|${kind === "per-100g" ? "per-100g" : kind === "per-100ml" ? "per-100ml" : kind === "per-serving" ? "per-serving" : "unknown"}`;
      }

      function findEffective(view, nutrientId, basis) {
        if (!view?.effective) return null;
        const key = makeSelectionKey(view.food.id, nutrientId, basis);
        return view.effective[key] || null;
      }

      function groupObservations(view, nutrientId, basis) {
        const key = makeSelectionKey(view.food.id, nutrientId, basis);
        const list = (view.observations || []).filter((o) => makeSelectionKey(o.foodId, o.nutrientId, o.basis) === key);
        list.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
        return list;
      }

      async function selectFood(foodId) {
        state.selectedFoodId = foodId;
        renderFoods();
        const view = await api.get(`/api/foods/${encodeURIComponent(foodId)}`);
        state.selectedFoodView = view;
        state.evidenceCache = view.evidence || {};
        renderFoodPills(view);
        renderDetail(view);
      }

      function renderDetail(view) {
        const root = $("#detail");
        if (!root) return;
        if (!view?.food) {
          root.innerHTML = `<div class="kpi"><div class="k">Start</div><div class="v">选择一个食物</div></div>`;
          return;
        }

        const basis = state.basis || { kind: "per-100g" };
        const amountIds = new Set([
          "energy_kj",
          "energy_kcal",
          "protein_g",
          "fat_g",
          "carb_g",
          "sodium_mg",
        ]);
        const nrvIds = new Set([
          "energy_nrv_pct",
          "protein_nrv_pct",
          "fat_nrv_pct",
          "carb_nrv_pct",
          "sodium_nrv_pct",
        ]);
        const amountNutrients = state.nutrients.filter((n) => amountIds.has(n.id));
        const nrvNutrients = state.nutrients.filter((n) => nrvIds.has(n.id));

        const nutrientRows = amountNutrients
          .filter((n) => n.id !== "energy_kcal")
          .map((n) => renderNutrientRow(view, n, basis))
          .join("");
        const nrvRows = nrvNutrients.map((n) => renderNutrientRow(view, n, basis)).join("");

        const evidenceInfo = renderEvidencePanel(view);

        root.innerHTML = `
          <div class="subhead">
            <h2>${escapeHtml(view.food.label || "(未命名)")}</h2>
            <div class="row-actions">
              <select id="basis-select" class="mono tiny" style="border-radius:999px;padding:7px 10px">
                ${basisOptions()
                  .map(
                    (b) =>
                      `<option value="${escapeHtml(b.kind)}" ${b.kind === basis.kind ? "selected" : ""}>${escapeHtml(
                        b.label
                      )}</option>`
                  )
                  .join("")}
              </select>
              <button class="btn ghost tiny" type="button" id="btn-refresh">刷新</button>
            </div>
          </div>

          <div class="subsection">
            <div class="subhead">
              <h2>当前营养（${escapeHtml(basisLabel(basis))}）</h2>
              <div class="hint">点击“历史”可切换来源 / 回滚</div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Nutrient</th>
                  <th>Value</th>
                  <th>Provenance</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${nutrientRows || `<tr><td colspan="4" class="muted">暂无数据</td></tr>`}
              </tbody>
            </table>
          </div>

          <div class="subsection">
            <div class="subhead">
              <h2>NRV%（${escapeHtml(basisLabel(basis))}）</h2>
              <div class="hint">可选：从标签识别或手动录入（同样可追溯）</div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Nutrient</th>
                  <th>Value</th>
                  <th>Provenance</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${nrvRows || `<tr><td colspan="4" class="muted">暂无数据</td></tr>`}
              </tbody>
            </table>
          </div>

          <div class="kpi" style="margin-top:10px">
            <div class="k">Workflow</div>
            <div class="v">默认值在这里；录入去 Capture；摄入去 Today</div>
            <div class="muted" style="font-size:12px">
              <a href="#capture" id="go-capture">去 Capture 写入标签数值</a> · <a href="#today" id="go-today">去 Today 记录摄入</a>
            </div>
          </div>

          ${evidenceInfo}
        `;

        $("#btn-refresh")?.addEventListener("click", () => selectFood(view.food.id));
        $("#basis-select")?.addEventListener("change", (e) => {
          const v = String(e.target?.value || "per-100g");
          state.basis = { kind: v };
          renderDetail(view);
        });
        $("#go-capture")?.addEventListener("click", () => {
          state.capture.foodId = view.food.id;
        });
        wireRowActions(view, basis);
        wireEvidenceCreate(view);
      }

      function basisLabel(basis) {
        if (!basis || !basis.kind) return "—";
        if (basis.kind === "per-100g") return "每 100g";
        if (basis.kind === "per-100ml") return "每 100ml";
        if (basis.kind === "per-serving") {
          if (basis?.servingSize?.quantity && basis?.servingSize?.unit) {
            return `每份（${basis.servingSize.quantity}${basis.servingSize.unit}）`;
          }
          return "每份";
        }
        return basis.kind;
      }

      function renderNutrientRow(view, nutrient, basis) {
        const eff = findEffective(view, nutrient.id, basis);
        const obs = eff?.observation || null;
        const prov = obs ? `${obs.source || "?"} · ${obs.method || "?"}` : "—";
        const val = obs ? `${escapeHtml(obs.value)} ${escapeHtml(obs.unit)}` : "—";
        const when = obs?.createdAt ? fmt(obs.createdAt) : "";
        return `<tr data-nutrient="${escapeHtml(nutrient.id)}">
          <td>${escapeHtml(nutrient.label)} <span class="muted mono">(${escapeHtml(nutrient.id)})</span></td>
          <td class="mono">${val}</td>
          <td class="muted">${escapeHtml(prov)}${when ? ` · ${escapeHtml(when)}` : ""}</td>
          <td style="text-align:right">
            <span class="row-actions">
              <button class="btn ghost tiny" type="button" data-action="history">历史</button>
              <button class="btn tiny" type="button" data-action="edit">${obs ? "改值" : "新增"}</button>
            </span>
          </td>
        </tr>`;
      }

      function wireRowActions(view, basis) {
        const rows = $$("tr[data-nutrient]");
        for (const row of rows) {
          const nutrientId = row.getAttribute("data-nutrient");
          row.querySelector('[data-action="history"]')?.addEventListener("click", () => openHistory(view, nutrientId, basis));
          row.querySelector('[data-action="edit"]')?.addEventListener("click", () => openEdit(view, nutrientId, basis));
        }
      }

      function evidenceSelectOptions(view) {
        const all = Object.values(view.evidence || {}).filter((e) => e && e.type === "evidence.create");
        all.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
        const options = [`<option value="">（不关联证据）</option>`];
        for (const e of all.slice(0, 30)) {
          options.push(`<option value="${escapeHtml(e.id)}">${escapeHtml(e.kind || "evidence")} · ${escapeHtml(fmt(e.createdAt))} · ${escapeHtml(e.id)}</option>`);
        }
        return options.join("");
      }

      function wireLabelImport(view) {
        const sel = $("#label-evidence");
        if (sel) sel.innerHTML = evidenceSelectOptions(view);

        const btnParse = $("#btn-parse");
        const btnSave = $("#btn-save-parsed");
        const preview = $("#parse-preview .v");
        let parsed = null;

        const doParse = () => {
          const text = $("#label-text")?.value || "";
          const override = String($("#import-basis")?.value || "auto");
          const servingRaw = String($("#import-serving")?.value || "").trim();
          const basisOverride = override === "auto" ? null : { kind: override };
          parsed = parseLabelText(text, { basisOverride, servingRaw });
          if (!preview) return;
          if (!parsed.items.length) {
            preview.textContent = "未识别到数值（你可以先手动添加/或调整 OCR 文本）";
            btnSave.disabled = true;
            return;
          }
          preview.innerHTML =
            `<span class="mono">${escapeHtml(parsed.basisLabel)}</span> · ` +
            parsed.items.map((i) => `${escapeHtml(i.nutrientId)}=${escapeHtml(i.value)}${escapeHtml(i.unit)}`).join(" · ");
          btnSave.disabled = false;
        };

        btnParse?.addEventListener("click", doParse);
        $("#label-text")?.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "enter") doParse();
        });

        btnSave?.addEventListener("click", async () => {
          if (!parsed?.items?.length) return;
          const evidenceId = String($("#label-evidence")?.value || "").trim();
          const datasetVersion = String($("#import-version")?.value || "").trim();
          const sourceId = String($("#import-sourceid")?.value || "").trim();
          const observations = parsed.items.map((i) => ({
            foodId: view.food.id,
            nutrientId: i.nutrientId,
            value: i.value,
            unit: i.unit,
            basis: parsed.basis,
            method: "label_verified",
            source: "user",
            sourceId,
            datasetVersion,
            evidenceId: evidenceId || "",
            note: "import:label_text",
          }));
          await api.post("/api/observations/batch", { observations });
          await selectFood(view.food.id);
        });
      }

      function parseLabelText(text, { basisOverride, servingRaw } = {}) {
        const raw = String(text || "");
        const t = raw.replace(/\u3000/g, " ").replace(/[：:]/g, ":").replace(/\s+/g, " ").trim();
        const basis = normalizeBasis(basisOverride || detectBasis(t), servingRaw || "");
        const items = [];

        const pushIf = (nutrientId, value, unit) => {
          if (value === "" || value == null) return;
          items.push({ nutrientId, value: String(value), unit });
        };

        const num =
          (s) =>
            String(s || "")
              .replace(",", ".")
              .match(/[0-9]+(?:\.[0-9]+)?/)?.[0] || "";

        const mEnergyKj = t.match(
          /能量[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*(kJ|kj|千焦)(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/,
        );
        const mEnergyKcal = t.match(
          /能量[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*(kcal|KCAL|千卡|大卡)(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/,
        );
        pushIf("energy_kj", mEnergyKj ? num(mEnergyKj[1]) : "", "kJ");
        pushIf("energy_kcal", mEnergyKcal ? num(mEnergyKcal[1]) : "", "kcal");
        pushIf(
          "energy_nrv_pct",
          mEnergyKj && mEnergyKj[3]
            ? num(mEnergyKj[3])
            : mEnergyKcal && mEnergyKcal[3]
            ? num(mEnergyKcal[3])
            : "",
          "%"
        );

        const mProtein = t.match(
          /蛋白质[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*g(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/i,
        );
        const mFat = t.match(
          /脂肪[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*g(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/i,
        );
        const mCarb = t.match(
          /(碳水化合物|碳水)[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*g(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/i,
        );
        const mSodium = t.match(
          /钠[^0-9]*([0-9]+(?:[.,][0-9]+)?)\s*mg(?:[^0-9%]*([0-9]+(?:[.,][0-9]+)?)\s*%?)?/i,
        );

        pushIf("protein_g", mProtein ? num(mProtein[1]) : "", "g");
        pushIf("fat_g", mFat ? num(mFat[1]) : "", "g");
        pushIf("carb_g", mCarb ? num(mCarb[2]) : "", "g");
        pushIf("sodium_mg", mSodium ? num(mSodium[1]) : "", "mg");
        pushIf("protein_nrv_pct", mProtein && mProtein[2] ? num(mProtein[2]) : "", "%");
        pushIf("fat_nrv_pct", mFat && mFat[2] ? num(mFat[2]) : "", "%");
        pushIf("carb_nrv_pct", mCarb && mCarb[3] ? num(mCarb[3]) : "", "%");
        pushIf("sodium_nrv_pct", mSodium && mSodium[2] ? num(mSodium[2]) : "", "%");

        const basisLabelText = basisLabel(basis);

        return { basis, basisLabel: basisLabelText, items };
      }

      function detectBasis(text) {
        const t = String(text || "");
        if (/每\s*100\s*(毫升|ml|mL)/.test(t)) return { kind: "per-100ml" };
        if (/每\s*100\s*(克|g|G)/.test(t)) return { kind: "per-100g" };
        const mServing = t.match(
          /每\s*份[^0-9]*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*(g|克|ml|mL|毫升)\s*\)?/,
        );
        if (mServing) {
          const q = Number.parseFloat(mServing[1]);
          const uRaw = String(mServing[2]).toLowerCase();
          const unit = uRaw.includes("ml") || uRaw.includes("毫升") ? "ml" : "g";
          if (!Number.isNaN(q)) return { kind: "per-serving", servingSize: { quantity: q, unit } };
        }
        if (/每\s*份/.test(t)) return { kind: "per-serving" };
        return { kind: "per-100g" };
      }

      function parseServing(servingRaw) {
        const s = String(servingRaw || "").trim();
        if (!s) return null;
        const m = s.match(/([0-9]+(?:\.[0-9]+)?)\s*(g|克|ml|mL|毫升)/);
        if (!m) return null;
        const q = Number.parseFloat(m[1]);
        if (Number.isNaN(q)) return null;
        const uRaw = String(m[2]).toLowerCase();
        const unit = uRaw.includes("ml") || uRaw.includes("毫升") ? "ml" : "g";
        return { quantity: q, unit };
      }

      function normalizeBasis(basis, servingRaw) {
        if (!basis || !basis.kind) return { kind: "per-100g" };
        if (basis.kind !== "per-serving") return basis;
        if (basis?.servingSize?.quantity && basis?.servingSize?.unit) return basis;
        const parsed = parseServing(servingRaw);
        if (!parsed) return basis;
        return { kind: "per-serving", servingSize: parsed };
      }

      async function prepareImage(file) {
        const img = await loadImage(file);
        const preview = await encodeScaled(img, 1024, 0.72);
        const thumb = await encodeScaled(img, 256, 0.78);
        return { preview, thumb };
      }

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.onerror = (e) => {
            URL.revokeObjectURL(url);
            reject(new Error("Failed to load image"));
          };
          img.src = url;
        });
      }

      async function encodeScaled(img, maxEdge, quality) {
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const scale = Math.min(1, maxEdge / Math.max(w, h));
        const cw = Math.max(1, Math.round(w * scale));
        const ch = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);

        const supportsWebp = (() => {
          try {
            return canvas.toDataURL("image/webp").startsWith("data:image/webp");
          } catch {
            return false;
          }
        })();
        const mime = supportsWebp ? "image/webp" : "image/jpeg";

        const blob = await new Promise((resolve) => canvas.toBlob(resolve, mime, quality));
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.readAsDataURL(blob);
        });
        return { mime, dataUrl, bytes: blob.size, width: cw, height: ch };
      }

      function openLightbox(src, title) {
        const lb = $("#lb");
        const inner = $("#lb-inner");
        const canvas = $("#lb-canvas");
        const meta = $("#lb-meta");
        if (!lb || !inner || !canvas) return;
        inner.innerHTML = "";
        const img = new Image();
        img.alt = title || "image";
        img.onload = () => resetLightbox(img);
        img.src = src;
        inner.appendChild(img);
        meta.textContent = `${title || ""} · ESC 关闭 · 滚轮缩放 · 拖拽移动 · 双击重置`;
        lb.setAttribute("aria-hidden", "false");
      }

      function closeLightbox() {
        $("#lb")?.setAttribute("aria-hidden", "true");
        $("#lb-inner").innerHTML = "";
      }

      function resetLightbox(img) {
        const canvas = $("#lb-canvas");
        const inner = $("#lb-inner");
        if (!canvas || !inner) return;
        const rect = canvas.getBoundingClientRect();
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        const s = Math.min(rect.width / iw, rect.height / ih);
        inner.dataset.scale = String(s);
        inner.dataset.x = String((rect.width - iw * s) / 2);
        inner.dataset.y = String((rect.height - ih * s) / 2);
        applyTransform(inner);
      }

      function applyTransform(inner) {
        const s = Number.parseFloat(inner.dataset.scale || "1");
        const x = Number.parseFloat(inner.dataset.x || "0");
        const y = Number.parseFloat(inner.dataset.y || "0");
        inner.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
      }

      (() => {
        const lb = $("#lb");
        const canvas = $("#lb-canvas");
        const inner = $("#lb-inner");
        const closeBtn = $("#lb-close");
        const dlgClose = $("#dlg-close");

        dlgClose?.addEventListener("click", closeDialog);
        $("#dlg-backdrop")?.addEventListener("click", (e) => {
          if (e.target?.id === "dlg-backdrop") closeDialog();
        });

        closeBtn?.addEventListener("click", closeLightbox);
        lb?.addEventListener("click", (e) => {
          if (e.target?.id === "lb") closeLightbox();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeDialog();
            closeLightbox();
          }
        });

        let dragging = false;
        let startX = 0;
        let startY = 0;
        let baseX = 0;
        let baseY = 0;

        canvas?.addEventListener("dblclick", () => {
          const img = inner?.querySelector("img");
          if (img) resetLightbox(img);
        });

        canvas?.addEventListener("mousedown", (e) => {
          if (!inner) return;
          dragging = true;
          startX = e.clientX;
          startY = e.clientY;
          baseX = Number.parseFloat(inner.dataset.x || "0");
          baseY = Number.parseFloat(inner.dataset.y || "0");
        });
        window.addEventListener("mousemove", (e) => {
          if (!dragging || !inner) return;
          inner.dataset.x = String(baseX + (e.clientX - startX));
          inner.dataset.y = String(baseY + (e.clientY - startY));
          applyTransform(inner);
        });
        window.addEventListener("mouseup", () => (dragging = false));

        canvas?.addEventListener(
          "wheel",
          (e) => {
            if (!inner) return;
            e.preventDefault();
            const scale = Number.parseFloat(inner.dataset.scale || "1");
            const next = Math.min(8, Math.max(0.08, scale * (e.deltaY > 0 ? 0.92 : 1.08)));
            inner.dataset.scale = String(next);
            applyTransform(inner);
          },
          { passive: false }
        );
      })();

                const msgId = note?.messageId ? String(note.messageId).slice(0, 12) + "…" : "";
                const meta = [from, msgId].filter(Boolean).join(" · ");
                const thumbHtml = thumb
                  ? `<img class="thumb" style="width:120px;height:120px" data-lightbox="${escapeHtml(preview)}" src="${escapeHtml(thumb)}" alt="evidence" />`
                  : `<div class="thumb" style="width:120px;height:120px;display:flex;align-items:center;justify-content:center"><span class="muted">no thumb</span></div>`;
                return `
                  <div class="history-item">
                    <div class="history-top">
                      <div>
                        <div class="history-val">${escapeHtml(kind)} · <span class="mono">${escapeHtml(id)}</span></div>
                        <div class="muted" style="font-size:12px;margin-top:2px">${escapeHtml(fmt(createdAt))}${meta ? ` · ${escapeHtml(meta)}` : ""}</div>
                      </div>
                      <div>${thumbHtml}</div>
                    </div>
                  </div>
                `;
              })
              .join("")}
          </div>
        `;

        $$("[data-lightbox]").forEach((img) =>
          img.addEventListener("click", () => openLightbox(img.getAttribute("data-lightbox"), "evidence")),
        );
      }

      async function mountFoods() {
        renderFoods();

      function pickTotals(view) {
        const totals = view?.totals || {};
        const get = (id) => (totals[id]?.value != null ? totals[id] : null);
        const fmtNum = (n) => (typeof n === "number" ? (Math.round(n * 100) / 100).toString() : "—");

        const kcal = get("energy_kcal");
        const kj = get("energy_kj");
        const protein = get("protein_g");
        const fat = get("fat_g");
        const carb = get("carb_g");
        const sodium = get("sodium_mg");

        const parts = [];
        if (kcal) parts.push(`能量 ${fmtNum(kcal.value)} ${escapeHtml(kcal.unit || "kcal")}`);
        else if (kj) parts.push(`能量 ${fmtNum(kj.value)} ${escapeHtml(kj.unit || "kJ")}`);
        if (protein) parts.push(`蛋白质 ${fmtNum(protein.value)} g`);
        if (fat) parts.push(`脂肪 ${fmtNum(fat.value)} g`);
        if (carb) parts.push(`碳水 ${fmtNum(carb.value)} g`);
        if (sodium) parts.push(`钠 ${fmtNum(sodium.value)} mg`);
        return parts.join(" · ") || "—";
      }

      async function loadToday() {
        const date = state.todayDate || localDateNow();
        const view = await api.get(`/api/today?date=${encodeURIComponent(date)}`);
        state.todayView = view;
        renderTodayView(view);
      }

      function renderTodayView(view) {
        const totalsEl = $("#today-totals .v");
        const countEl = $("#today-count");
        const entriesRoot = $("#today-entries");

        if (totalsEl) totalsEl.textContent = pickTotals(view);
        if (countEl) countEl.textContent = `${(view.entries || []).filter((e) => !e.voidedAt).length} entries（撤销不计入）`;
        if (!entriesRoot) return;

        const entries = view.entries || [];
        if (!entries.length) {
          entriesRoot.innerHTML = `<div class="muted" style="font-size:12px">暂无记录</div>`;
          return;
        }

        const fmtNum = (n) => (typeof n === "number" ? (Math.round(n * 100) / 100).toString() : "—");
        entriesRoot.innerHTML = entries
          .map((e) => {
            const kcal = e.computed?.energy_kcal?.value;
            const kj = e.computed?.energy_kj?.value;
            const energy = kcal != null ? `${fmtNum(kcal)} kcal` : kj != null ? `${fmtNum(kj)} kJ` : "—";
            const p = e.computed?.protein_g?.value;
            const f = e.computed?.fat_g?.value;
            const c = e.computed?.carb_g?.value;
            const s = e.computed?.sodium_mg?.value;
            const muted = e.voidedAt ? ` <span class="pill">voided</span>` : "";
            return `
              <div class="history-item" data-intake="${escapeHtml(e.id)}">
                <div class="history-top">
                  <div>
                    <div class="history-val">${escapeHtml(fmtTime(e.consumedAt))} · ${escapeHtml(e.food?.label || e.foodLabel || e.foodId)}${muted}</div>
                    <div class="history-meta mono">${escapeHtml(energy)} · P ${escapeHtml(fmtNum(p))} · F ${escapeHtml(fmtNum(f))} · C ${escapeHtml(fmtNum(c))} · Na ${escapeHtml(fmtNum(s))}</div>
                    <div class="muted" style="font-size:12px;margin-top:2px">${escapeHtml(e.amount?.quantity)} ${escapeHtml(e.amount?.unit)} · ${escapeHtml(basisLabel(e.basis))}</div>
                  </div>
                  <div class="row-actions">
                    <button class="btn ghost tiny" type="button" data-action="why">明细</button>
                    <button class="btn ghost tiny" type="button" data-action="edit" ${e.voidedAt ? "disabled" : ""}>改量</button>
                    <button class="btn ghost tiny" type="button" data-action="recalc" ${e.voidedAt ? "disabled" : ""}>重算</button>
                    <button class="btn tiny" type="button" data-action="void" ${e.voidedAt ? "disabled" : ""}>撤销</button>
                  </div>
                </div>
              </div>
            `;
          })
          .join("");

        $$("[data-intake]").forEach((row) => {
          const id = row.getAttribute("data-intake");
          const entry = entries.find((x) => x.id === id);
          if (!entry) return;
          row.querySelector('[data-action="why"]')?.addEventListener("click", () => openIntakeWhy(entry));
          row.querySelector('[data-action="edit"]')?.addEventListener("click", () => openIntakeEdit(entry));
          row.querySelector('[data-action="recalc"]')?.addEventListener("click", async () => {
            await api.post("/api/intakes/recalc", { intakeId: entry.id, basis: entry.basis });
            await loadToday();
          });
          row.querySelector('[data-action="void"]')?.addEventListener("click", async () => {
            if (!confirm("撤销这条 Today entry？（不会删除记录）")) return;
            await api.post("/api/intakes/void", { intakeId: entry.id, reason: "user_void" });
            await loadToday();
          });
        });
      }

            <div class="muted" style="font-size:12px">${escapeHtml(fmt(entry.consumedAt))} · ${escapeHtml(entry.amount?.quantity)} ${escapeHtml(entry.amount?.unit)} · ${escapeHtml(basisLabel(entry.basis))}</div>

      async function mountToday() {
        const dateInput = $("#today-date");
        const timeInput = $("#today-time");
        const basisSel = $("#today-basis");
        const unitPill = $("#today-amt-unit");
        const foodSel = $("#today-food");
        const amtInput = $("#today-amt");
        const addBtn = $("#today-add");

        if (dateInput) dateInput.value = state.todayDate || localDateNow();
        if (timeInput) timeInput.value = localTimeNow();
        renderFoodOptions(foodSel, { allowEmpty: true });

        const syncUnit = () => {
          const kind = String(basisSel?.value || "per-100g");
          if (unitPill) unitPill.textContent = unitForBasisKind(kind);
        };
        basisSel?.addEventListener("change", syncUnit);
        syncUnit();

        $("#today-prev")?.addEventListener("click", async () => {
          const cur = new Date(`${state.todayDate}T00:00:00`);
          cur.setDate(cur.getDate() - 1);
          state.todayDate = localDateNowFrom(cur);
          if (dateInput) dateInput.value = state.todayDate;
          await loadToday();
        });
        $("#today-next")?.addEventListener("click", async () => {
          const cur = new Date(`${state.todayDate}T00:00:00`);
          cur.setDate(cur.getDate() + 1);
          state.todayDate = localDateNowFrom(cur);
          if (dateInput) dateInput.value = state.todayDate;
          await loadToday();
        });

        dateInput?.addEventListener("change", async () => {
          state.todayDate = String(dateInput.value || "").trim() || localDateNow();
          await loadToday();
        });

        addBtn?.addEventListener("click", async () => {
          const foodId = String(foodSel?.value || "").trim();
          if (!foodId) return alert("请选择 Food");
          const kind = String(basisSel?.value || "per-100g");
          const qty = Number.parseFloat(String(amtInput?.value || "").trim() || "0");
          if (!qty || qty <= 0) return alert("Amount 必须 > 0");
          const unit = unitForBasisKind(kind);
          const consumedAt = isoFromLocal(state.todayDate, String(timeInput?.value || "").trim());
          await api.post("/api/intakes", {
            foodId,
            consumedAt,
            localDate: state.todayDate,
            amount: { quantity: qty, unit },
            basis: { kind },
            note: "",
          });
          amtInput.value = "";
          await loadToday();
        });

        await loadToday();
      }

      function localDateNowFrom(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      async function mountCapture() {
        const foodSel = $("#cap-food");
        const evidenceSel = $("#cap-evidence");
        const date = $("#cap-today-date");
        const time = $("#cap-today-time");
        const amtUnit = $("#cap-amt-unit");
        const amtInput = $("#cap-amt");

        renderFoodOptions(foodSel, { allowEmpty: true });
        if (state.capture.foodId) foodSel.value = state.capture.foodId;

        if (date) date.value = state.todayDate || localDateNow();
        if (time) time.value = localTimeNow();

        const ensureEvidenceOptions = async () => {
          const foodId = String(foodSel?.value || "").trim();
          if (!foodId) {
            if (evidenceSel) evidenceSel.innerHTML = `<option value="">（先选食物）</option>`;
            return;
          }
          const view = await api.get(`/api/foods/${encodeURIComponent(foodId)}`);
          state.selectedFoodView = view;
          state.evidenceCache = view.evidence || {};
          if (evidenceSel) evidenceSel.innerHTML = evidenceSelectOptions(view);
          if (state.capture.evidenceId) evidenceSel.value = state.capture.evidenceId;
        };

        await ensureEvidenceOptions();
        foodSel?.addEventListener("change", async () => {
          state.capture.foodId = String(foodSel.value || "").trim();
          await ensureEvidenceOptions();
        });

        $("#cap-new-food")?.addEventListener("click", openNewFood);

        const defaultQtyForBasisKind = (kind) => (String(kind || "") === "per-serving" ? 1 : 100);

        const syncAmtUnit = () => {
          const override = String($("#cap-basis")?.value || "auto");
          const basisKind = override === "auto" ? "per-100g" : override;
          if (amtUnit) amtUnit.textContent = unitForBasisKind(basisKind);
          if (amtInput && !String(amtInput.value || "").trim()) amtInput.value = String(defaultQtyForBasisKind(basisKind));
        };
        $("#cap-basis")?.addEventListener("change", syncAmtUnit);
        syncAmtUnit();

        $("#cap-ev-clear")?.addEventListener("click", () => {
          $("#cap-ev-file").value = "";
          $("#cap-ev-ocr").value = "";
          $("#cap-ev-note").value = "";
          state.capture.evidenceId = "";
          const box = $("#cap-ev-preview");
          if (box) box.innerHTML = `<div class="k">Evidence</div><div class="v">未保存</div><div class="muted" style="font-size:12px">保存后可关联到 observation / Today 明细。</div>`;
          ensureEvidenceOptions();
        });

        $("#cap-ev-save")?.addEventListener("click", async () => {
          const foodId = String(foodSel?.value || "").trim();
          if (!foodId) return alert("请先选择食物");
          const file = $("#cap-ev-file")?.files?.[0];
          if (!file) return alert("请选择图片");
          const uploadToR2 = Boolean($("#cap-ev-upload")?.checked);
          const ocrText = String($("#cap-ev-ocr")?.value || "");
          const note = String($("#cap-ev-note")?.value || "");
          const prepared = await prepareImage(file);
          const res = await api.post("/api/evidence", {
            kind: "nutrition_label",
            preview: { mime: prepared.preview.mime, dataBase64: prepared.preview.dataUrl, width: prepared.preview.width, height: prepared.preview.height },
            thumb: { mime: prepared.thumb.mime, dataBase64: prepared.thumb.dataUrl, width: prepared.thumb.width, height: prepared.thumb.height },
            ocrText,
            note,
            uploadToR2,
          });
          const ev = res?.evidence;
          if (ev?.id) state.capture.evidenceId = ev.id;
          const box = $("#cap-ev-preview");
          const uploadError = res?.uploadError || "";
          const url = ev?.r2?.url;
          if (box) {
            box.innerHTML = `
              <div class="k">Evidence</div>
              <div class="v mono">${escapeHtml(ev?.id || "")}</div>
              <div class="muted" style="font-size:12px">${url ? `R2: ${escapeHtml(url)}` : uploadToR2 ? "R2: no public url / failed" : "R2: off"}${uploadError ? ` · uploadError: ${escapeHtml(uploadError)}` : ""}</div>
              <div style="height:10px"></div>
              <img class="thumb" style="width:140px;height:140px" src="${escapeHtml(ev?.thumb?.path || "")}" alt="thumb" data-lightbox="${escapeHtml(ev?.preview?.path || "")}" />
            `;
            box.querySelector("[data-lightbox]")?.addEventListener("click", () => openLightbox(ev?.preview?.path || ev?.thumb?.path, "evidence"));
          }
          await ensureEvidenceOptions();
          if (ev?.id && evidenceSel) evidenceSel.value = ev.id;
        });

        const parseBtn = $("#cap-parse");
        const commitBtn = $("#cap-commit");
        const parseV = $("#cap-parse-v");
        const review = $("#cap-review");
        let parsed = null;

        const doParse = () => {
          const text = String($("#cap-text")?.value || "");
          const override = String($("#cap-basis")?.value || "auto");
          const servingRaw = String($("#cap-serving")?.value || "").trim();
          const basisOverride = override === "auto" ? null : { kind: override };
          parsed = parseLabelText(text, { basisOverride, servingRaw });
          if (!parseV || !review) return;
          if (!parsed.items.length) {
            parseV.textContent = "未识别到数值（可先调整文本或手动录入）";
            review.innerHTML = "";
            commitBtn.disabled = true;
            return;
          }
          parseV.innerHTML =
            `<span class="mono">${escapeHtml(parsed.basisLabel)}</span> · ` +
            parsed.items.map((i) => `${escapeHtml(i.nutrientId)}=${escapeHtml(i.value)}${escapeHtml(i.unit)}`).join(" · ");

          review.innerHTML = `
            <table>
              <thead><tr><th>Nutrient</th><th>Value</th><th>Unit</th></tr></thead>
              <tbody>
                ${parsed.items
                  .map((i) => {
                    const n = state.nutrients.find((x) => x.id === i.nutrientId) || { label: i.nutrientId };
                    return `
                      <tr data-cap-nutrient="${escapeHtml(i.nutrientId)}">
                        <td>${escapeHtml(n.label)} <span class="muted mono">(${escapeHtml(i.nutrientId)})</span></td>
                        <td><input class="mono" data-cap="value" value="${escapeHtml(i.value)}" /></td>
                        <td><input class="mono" data-cap="unit" value="${escapeHtml(i.unit)}" /></td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          `;
          commitBtn.disabled = false;
        };

        parseBtn?.addEventListener("click", doParse);
        $("#cap-text")?.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "enter") doParse();
        });

        commitBtn?.addEventListener("click", async () => {
          const foodId = String(foodSel?.value || "").trim();
          if (!foodId) return alert("请先选择食物");
          if (!parsed?.items?.length) return alert("请先解析");

          const method = String($("#cap-method")?.value || "label_ocr").trim();
          const evidenceId = String($("#cap-evidence")?.value || "").trim();
          const datasetVersion = String($("#cap-version")?.value || "").trim();
          const sourceId = String($("#cap-sourceid")?.value || "").trim();

          const items = $$("tr[data-cap-nutrient]")
            .map((tr) => {
              const nutrientId = tr.getAttribute("data-cap-nutrient");
              const value = String(tr.querySelector('[data-cap="value"]')?.value || "").trim();
              const unit = String(tr.querySelector('[data-cap="unit"]')?.value || "").trim();
              return { nutrientId, value, unit };
            })
            .filter((i) => i.nutrientId && i.value && i.unit);

          const observations = items.map((i) => ({
            foodId,
            nutrientId: i.nutrientId,
            value: i.value,
            unit: i.unit,
            basis: parsed.basis,
            method,
            source: "user",
            sourceId,
            datasetVersion,
            evidenceId: evidenceId || "",
            note: "import:capture_label_text",
          }));

          await api.post("/api/observations/batch", { observations });

          const addToday = Boolean($("#cap-add-today")?.checked);
          if (addToday) {
            let qty = Number.parseFloat(String($("#cap-amt")?.value || "").trim() || "0");
            if (!(qty > 0)) qty = defaultQtyForBasisKind(parsed.basis?.kind || "per-100g");
            if (qty > 0) {
              const dateStr = String($("#cap-today-date")?.value || state.todayDate || localDateNow());
              const timeStr = String($("#cap-today-time")?.value || localTimeNow());
              const unit = unitForBasisKind(parsed.basis?.kind || "per-100g");
              await api.post("/api/intakes", {
                foodId,
                consumedAt: isoFromLocal(dateStr, timeStr),
                localDate: dateStr,
                amount: { quantity: qty, unit },
                basis: parsed.basis,
                note: "",
              });
              state.todayDate = dateStr;
            }
          }

          alert("已写入 observation" + (addToday ? "（并加入 Today）" : ""));
          state.selectedFoodId = foodId;
          location.hash = "#foods";
        });
      }

          return;

          state.foods = [res.food, ...state.foods.filter((f) => f.id !== res.food.id)];
          state.selectedFoodId = res.food.id;
          state.capture.foodId = res.food.id;
          if (state.route === "foods") {
            renderFoods();
            await selectFood(res.food.id);
            return;
          }
          if (state.route === "capture") {
            await renderApp();
            return;
          }
          location.hash = "#foods";
        });
      }

      boot().catch((e) => alert(String(e?.message || e)));
    </script>
  </body>
</html>
